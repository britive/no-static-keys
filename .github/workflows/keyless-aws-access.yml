name: Britive keyless intake pipeline (GitHub OIDC -> Britive -> AWS, GCP, Azure)
# A nightly "intake" job with NO stored cloud keys.
#
#   1. GitHub mints an OIDC token for this repo + branch.
#   2. Britive (demo.britive-app.com) trusts that token through the `Github`
#      identity provider and maps it to the federated service identity
#      NHI-Intake-GitHub-no-static-keys.
#   3. That identity checks out the Britive profile NHI-Intake-AWS-Writer and
#      receives short-lived AWS credentials for one IAM role whose only power
#      is read/write under   s3://<bucket>/demo-tenant/*
#   4. The job writes today's customer-intake batch, reads it back, proves a
#      write OUTSIDE its prefix is denied, then checks the credential back in.
#
# The same batch is what humans and AI agents read later through the
# NHI-Intake-AWS-Reader profile (and, later, through the Britive MCP Gateway).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5'   # weekdays 08:00 UTC; a Monday demo shows Friday's batch

permissions:
  id-token: write   # lets the job request a GitHub OIDC token
  contents: read

env:
  BRITIVE_TENANT: demo
  FED_PROVIDER: github-britive            # GitHub OIDC token, audience "britive"
  BRITIVE_PROFILE: "AWS SE Organization/696226360299 (se-demo)/NHI-Intake-AWS-Writer"
  S3_BUCKET: britive-jit-demo-696226360299
  PREFIX: demo-tenant                     # the ONLY place this identity can touch
  AWS_REGION: us-east-1
  RETAIN: 10                              # batch dates kept under demo-tenant/daily/

jobs:
  aws-intake:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gen.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pybritive
        run: pip install --quiet pybritive

      - name: Batch date
        run: echo "BATCH_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      # Keyless: no secrets in this repo. pybritive exchanges the GitHub OIDC
      # token for a Britive session, then checks out the profile.
      - name: Britive checkout (federated, no stored keys)
        run: |
          for attempt in 1 2 3 4 5 6; do
            rc=0
            pybritive checkout "$BRITIVE_PROFILE" -P "$FED_PROVIDER" -m env-nix --silent > /tmp/co.out 2>&1 || rc=$?
            if [ "$rc" -eq 0 ] && grep -q '^export AWS_SECRET_ACCESS_KEY=' /tmp/co.out; then
              echo "checkout ok on attempt $attempt"; break
            fi
            echo "attempt $attempt failed (rc=$rc): $(grep -v AWS_ /tmp/co.out | head -c 300)"
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 20
          done
          grep '^export AWS_' /tmp/co.out > /tmp/aws.env
          rm -f /tmp/co.out
          set -a; . /tmp/aws.env; set +a      # the shell strips pybritive's quoting
          rm -f /tmp/aws.env
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_SESSION_TOKEN"
          {
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN"
          } >> "$GITHUB_ENV"

      - name: Who am I in AWS?
        run: |
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          echo "WRITER_ARN=$ARN" >> "$GITHUB_ENV"
          echo "::notice::Writing as $ARN (a JIT role session, minted seconds ago)"

      - name: Generate today's intake batch
        id: gen
        run: |
          python3 scripts/gen-intake.py \
            --date "$BATCH_DATE" \
            --out /tmp/intake.csv \
            --manifest /tmp/intake.manifest.json \
            --cloud aws \
            --run-id "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --actor "${{ github.actor }}" \
            --written-by "$WRITER_ARN"
          echo "rows: $(($(wc -l < /tmp/intake.csv) - 1))"
          sha256sum /tmp/intake.csv | tee /tmp/local.sha
          echo "sha=$(cut -d' ' -f1 /tmp/local.sha)" >> "$GITHUB_OUTPUT"

      - name: Write the batch to S3
        run: |
          aws s3 cp /tmp/intake.csv           "s3://$S3_BUCKET/$PREFIX/daily/$BATCH_DATE.csv"           --only-show-errors
          aws s3 cp /tmp/intake.manifest.json "s3://$S3_BUCKET/$PREFIX/daily/$BATCH_DATE.manifest.json" --only-show-errors
          echo "::notice::Wrote s3://$S3_BUCKET/$PREFIX/daily/$BATCH_DATE.csv"

      - name: Read it back and verify
        run: |
          aws s3 cp "s3://$S3_BUCKET/$PREFIX/daily/$BATCH_DATE.csv" /tmp/readback.csv --only-show-errors
          LOCAL=$(cut -d' ' -f1 /tmp/local.sha); REMOTE=$(sha256sum /tmp/readback.csv | cut -d' ' -f1)
          echo "local  $LOCAL"; echo "remote $REMOTE"
          [ "$LOCAL" = "$REMOTE" ] || { echo "::error::read-back mismatch"; exit 1; }
          echo "Round-trip verified."

      # Least privilege, shown rather than claimed. Both commands MUST fail;
      # the step fails if either one succeeds.
      - name: Prove the scope - writes outside demo-tenant/ are denied
        run: |
          echo "nope" > /tmp/nope.txt
          rc=0; aws s3 cp /tmp/nope.txt "s3://$S3_BUCKET/daily/not-mine.txt" --only-show-errors 2> /tmp/err1 || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::write outside the prefix SUCCEEDED"; exit 1; fi
          echo "DENIED (rc=$rc): $(grep -o 'AccessDenied[^:]*' /tmp/err1 | head -1)"
          rc=0; aws s3 ls > /dev/null 2> /tmp/err2 || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::list-all-buckets SUCCEEDED"; exit 1; fi
          echo "DENIED (rc=$rc): list all buckets"

      - name: Keep the last ${{ env.RETAIN }} batches
        run: |
          aws s3api list-objects-v2 --bucket "$S3_BUCKET" --prefix "$PREFIX/daily/" \
            --query 'Contents[].Key' --output text | tr '\t' '\n' | grep -v '^None$' \
            | python3 scripts/prune.py --mode date --keep "$RETAIN" \
            | while read -r key; do
                [ -n "$key" ] || continue
                case "$key" in "$PREFIX"/daily/*) ;; *) echo "refusing $key"; exit 1;; esac
                aws s3 rm "s3://$S3_BUCKET/$key" --only-show-errors && echo "pruned $key"
              done
          echo "Batches now in s3://$S3_BUCKET/$PREFIX/daily/:"
          aws s3 ls "s3://$S3_BUCKET/$PREFIX/daily/"

      - name: Check the credential back in
        if: always()
        run: |
          pybritive checkin "$BRITIVE_PROFILE" -P "$FED_PROVIDER" || true
          echo "Checked in. The role session above stops being re-issuable now."

  # ---------------------------------------------------------------------------
  # GCP: same identity, same batch, project `lendingsavings`.
  # Profile NHI-Intake-GCP-Writer = Storage Object User with an IAM condition
  # that pins it to ONE bucket. Britive mints a fresh service account per
  # checkout, and the binding can take a little while to propagate, so we poll.
  # ---------------------------------------------------------------------------
  gcp-intake:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gen.outputs.sha }}
    env:
      GCP_PROFILE: "GCP - CIS/GCP - CIS/NHI-Intake-GCP-Writer"
      GCS_BUCKET: britive-nhi-intake-810261868576
      NEIGHBOUR_BUCKET: acme-corp-backup-storage   # same project, must be denied
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pybritive
      - run: echo "BATCH_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Britive checkout (federated, no stored keys)
        run: |
          for attempt in 1 2 3 4 5 6; do
            rc=0
            pybritive checkout "$GCP_PROFILE" -P "$FED_PROVIDER" -m json --silent > /tmp/co.out 2>&1 || rc=$?
            if [ "$rc" -eq 0 ] && grep -q 'private_key' /tmp/co.out; then echo "checkout ok on attempt $attempt"; break; fi
            echo "attempt $attempt failed (rc=$rc): $(grep -v private_key /tmp/co.out | head -c 300)"
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 20
          done
          # The key arrives either as the key JSON itself or as
          # {"<sa-email>": "<key JSON as a string>"}; normalise to a key file.
          python3 scripts/sa-key.py /tmp/co.out /tmp/sa.json
          rm -f /tmp/co.out
          gcloud auth activate-service-account --key-file=/tmp/sa.json --quiet
          rm -f /tmp/sa.json
          echo "WRITER=$(gcloud config get-value account 2>/dev/null)" >> "$GITHUB_ENV"

      - name: Generate today's intake batch
        id: gen
        run: |
          python3 scripts/gen-intake.py --date "$BATCH_DATE" --out /tmp/intake.csv \
            --manifest /tmp/intake.manifest.json --cloud gcp \
            --run-id "${{ github.run_id }}" --repo "${{ github.repository }}" \
            --actor "${{ github.actor }}" --written-by "$WRITER"
          echo "sha=$(sha256sum /tmp/intake.csv | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Write the batch to GCS (polls while the grant propagates)
        run: |
          start=$(date +%s)
          for i in $(seq 1 16); do
            rc=0
            gcloud storage cp /tmp/intake.csv "gs://$GCS_BUCKET/$PREFIX/daily/$BATCH_DATE.csv" 2>/tmp/err || rc=$?
            if [ "$rc" -eq 0 ]; then echo "grant live after $(( $(date +%s) - start ))s"; break; fi
            if [ "$i" -eq 16 ]; then cat /tmp/err; exit 1; fi
            sleep 15
          done
          gcloud storage cp /tmp/intake.manifest.json "gs://$GCS_BUCKET/$PREFIX/daily/$BATCH_DATE.manifest.json"
          echo "::notice::Wrote gs://$GCS_BUCKET/$PREFIX/daily/$BATCH_DATE.csv as $WRITER"

      - name: Read it back and verify
        run: |
          gcloud storage cp "gs://$GCS_BUCKET/$PREFIX/daily/$BATCH_DATE.csv" /tmp/readback.csv
          [ "$(sha256sum < /tmp/intake.csv)" = "$(sha256sum < /tmp/readback.csv)" ] || { echo "::error::read-back mismatch"; exit 1; }
          echo "Round-trip verified."

      - name: Prove the scope - the neighbouring bucket is denied
        run: |
          echo nope > /tmp/nope.txt
          rc=0; gcloud storage cp /tmp/nope.txt "gs://$NEIGHBOUR_BUCKET/not-mine.txt" 2>/tmp/err || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::write to $NEIGHBOUR_BUCKET SUCCEEDED"; exit 1; fi
          echo "DENIED (rc=$rc): $(grep -o 'HTTPError 40[0-9]' /tmp/err | head -1) writing to $NEIGHBOUR_BUCKET"

      - name: Keep the last ${{ env.RETAIN }} batches
        run: |
          gcloud storage ls "gs://$GCS_BUCKET/$PREFIX/daily/" | sed "s#gs://$GCS_BUCKET/##" \
            | python3 scripts/prune.py --mode date --keep "$RETAIN" \
            | while read -r key; do
                [ -n "$key" ] || continue
                case "$key" in "$PREFIX"/daily/*) ;; *) echo "refusing $key"; exit 1;; esac
                gcloud storage rm "gs://$GCS_BUCKET/$key" && echo "pruned $key"
              done
          gcloud storage ls -l "gs://$GCS_BUCKET/$PREFIX/daily/"

      - name: Check the credential back in
        if: always()
        run: pybritive checkin "$GCP_PROFILE" -P "$FED_PROVIDER" || true

  # ---------------------------------------------------------------------------
  # Azure: same identity, profile Acme-Corp-Storage-Container (Storage Blob Data
  # Contributor on resource group acmecorpbackupstorage). Britive mints a new
  # service principal per checkout; the role assignment takes a moment to land.
  # Honest scope note: Azure grants land at the resource group, so this
  # identity could also reach the other container in the same account.
  # ---------------------------------------------------------------------------
  azure-intake:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gen.outputs.sha }}
    env:
      AZ_PROFILE: "Britive Azure Tenant/Britive Azure Tenant/Acme-Corp-Storage-Container"
      AZ_ACCOUNT: acmecorpbackupstorage
      AZ_CONTAINER: nhi-intake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pybritive
      - run: echo "BATCH_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Britive checkout + az login (federated, no stored keys)
        run: |
          for attempt in 1 2 3 4 5 6; do
            rc=0
            pybritive checkout "$AZ_PROFILE" -P "$FED_PROVIDER" -m json --silent > /tmp/co.out 2>&1 || rc=$?
            ok=0; python3 scripts/az-creds.py /tmp/co.out /tmp/az.env || ok=$?
            if [ "$rc" -eq 0 ] && [ "$ok" -eq 0 ]; then echo "checkout ok on attempt $attempt"; break; fi
            echo "attempt $attempt failed (rc=$rc)"
            # a retry that lands on an existing transaction gets no secret: check in first
            pybritive checkin "$AZ_PROFILE" -P "$FED_PROVIDER" >/dev/null 2>&1 || true
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 20
          done
          rm -f /tmp/co.out
          set -a; . /tmp/az.env; set +a; rm -f /tmp/az.env
          echo "::add-mask::$AZ_SECRET"
          for i in $(seq 1 12); do
            rc=0; az login --service-principal -u "$AZ_CLIENT" --password="$AZ_SECRET" --tenant "$AZ_TENANT" --allow-no-subscriptions -o none || rc=$?
            [ "$rc" -eq 0 ] && break
            [ "$i" -eq 12 ] && exit 1
            sleep 15
          done
          echo "WRITER=service principal $AZ_CLIENT (minted for this run)" >> "$GITHUB_ENV"

      - name: Generate today's intake batch
        id: gen
        run: |
          python3 scripts/gen-intake.py --date "$BATCH_DATE" --out /tmp/intake.csv \
            --manifest /tmp/intake.manifest.json --cloud azure \
            --run-id "${{ github.run_id }}" --repo "${{ github.repository }}" \
            --actor "${{ github.actor }}" --written-by "$WRITER"
          echo "sha=$(sha256sum /tmp/intake.csv | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Write the batch to Azure Blob (polls while the role lands)
        run: |
          start=$(date +%s)
          for i in $(seq 1 20); do
            rc=0
            az storage blob upload --account-name "$AZ_ACCOUNT" -c "$AZ_CONTAINER" -n "daily/$BATCH_DATE.csv" \
              -f /tmp/intake.csv --overwrite --auth-mode login -o none --only-show-errors || rc=$?
            if [ "$rc" -eq 0 ]; then echo "role live after $(( $(date +%s) - start ))s"; break; fi
            [ "$i" -eq 20 ] && exit 1
            sleep 15
          done
          az storage blob upload --account-name "$AZ_ACCOUNT" -c "$AZ_CONTAINER" -n "daily/$BATCH_DATE.manifest.json" \
            -f /tmp/intake.manifest.json --overwrite --auth-mode login -o none --only-show-errors
          echo "::notice::Wrote $AZ_ACCOUNT/$AZ_CONTAINER/daily/$BATCH_DATE.csv"

      - name: Read it back and verify
        run: |
          az storage blob download --account-name "$AZ_ACCOUNT" -c "$AZ_CONTAINER" -n "daily/$BATCH_DATE.csv" \
            -f /tmp/readback.csv --auth-mode login -o none --only-show-errors
          [ "$(sha256sum < /tmp/intake.csv)" = "$(sha256sum < /tmp/readback.csv)" ] || { echo "::error::read-back mismatch"; exit 1; }
          echo "Round-trip verified."

      - name: Prove the scope - no control-plane access
        run: |
          rc=0; az group list -o none 2>/tmp/err || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::listing resource groups SUCCEEDED"; exit 1; fi
          echo "DENIED (rc=$rc): this identity holds blob data rights only, no subscription access"

      - name: Keep the last ${{ env.RETAIN }} batches
        run: |
          az storage blob list --account-name "$AZ_ACCOUNT" -c "$AZ_CONTAINER" --prefix daily/ \
            --auth-mode login --query "[].name" -o tsv \
            | python3 scripts/prune.py --mode date --keep "$RETAIN" \
            | while read -r key; do
                [ -n "$key" ] || continue
                case "$key" in daily/*) ;; *) echo "refusing $key"; exit 1;; esac
                az storage blob delete --account-name "$AZ_ACCOUNT" -c "$AZ_CONTAINER" -n "$key" --auth-mode login -o none && echo "pruned $key"
              done
          az storage blob list --account-name "$AZ_ACCOUNT" -c "$AZ_CONTAINER" --prefix daily/ --auth-mode login -o table

      - name: Check the credential back in
        if: always()
        run: |
          az logout || true
          pybritive checkin "$AZ_PROFILE" -P "$FED_PROVIDER" || true

  # Three clouds, three JIT identities, one batch: the bytes must match.
  compare-clouds:
    needs: [aws-intake, gcp-intake, azure-intake]
    runs-on: ubuntu-latest
    steps:
      - name: Same bytes in every cloud
        run: |
          A="${{ needs.aws-intake.outputs.sha }}"; G="${{ needs.gcp-intake.outputs.sha }}"; Z="${{ needs.azure-intake.outputs.sha }}"
          echo "aws   $A"; echo "gcp   $G"; echo "azure $Z"
          if [ -n "$A" ] && [ "$A" = "$G" ] && [ "$A" = "$Z" ]; then
            echo "::notice::Identical batch in S3, GCS and Azure Blob, written by three separate JIT identities."
          else
            echo "::error::clouds differ"; exit 1
          fi
